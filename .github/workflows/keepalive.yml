name: Keep Hugging Face Spaces Alive
on:
  schedule:
    - cron: '0 * * * *'  # Cada 1 hora
  workflow_dispatch:  # Permite ejecutar manualmente

jobs:
  ping-spaces:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping Gemma Server
        run: |
          echo "🔄 Haciendo ping a Gemma Server..."
          # Primer ping más largo para despertar el Space
          curl -X GET -m 120 "https://alejandrott24-mi-gemma-servidor.hf.space/preguntar?mensaje=ping" || echo "⚠️ Gemma no respondió en el primer intento"
          # Segundo ping después de 10 segundos
          sleep 10
          curl -X GET -m 30 "https://alejandrott24-mi-gemma-servidor.hf.space/preguntar?mensaje=ping" || echo "⚠️ Gemma no respondió en el segundo intento"
          
      - name: Ping Piper TTS Server
        run: |
          echo "🔄 Haciendo ping a Piper TTS..."
          curl -I -m 30 https://alejandrott24-piper-tts-server.hf.space/ || echo "⚠️ Piper no respondió"
          
      - name: Ping Moondream Vision Server
        run: |
          echo "🔄 Haciendo ping a Moondream Vision..."
          curl -I -m 30 https://alejandrott24-mi-moondream-vision.hf.space/ || echo "⚠️ Moondream no respondió"
          
      - name: Completado
        run: echo "✅ Ping completado a todos los Spaces (Gemma, Piper TTS y Moondream)"
